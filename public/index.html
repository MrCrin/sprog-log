    // Simple pill-style tab bar, reused for the growth tabs and the
    // milestones tabs. `tabs` is an array of { key, label }.
    function TabBar({ tabs, activeKey, onChange }) {
      return (
        <div className="flex flex-wrap gap-2 mb-5">
          {tabs.map((tab) => (
            <button
              key={tab.key}
              type="button"
              onClick={() => onChange(tab.key)}
              className={
                "px-4 py-2 text-sm font-medium rounded-full transition-colors " +
                (activeKey === tab.key
                  ? "bg-indigo-600 text-white shadow-sm"
                  : "bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-600")
              }
            >
              {tab.label}
            </button>
          ))}
        </div>
      );
    }

    // Marker rendered at the top of a milestone's vertical reference line,
    // using the milestone's chosen icon. Recharts calls this with cx/cy
    // already resolved to real pixel coordinates within the chart's SVG, so
    // the marker lines up exactly with the ReferenceLine drawn for the same
    // timestamp. Selecting it (click, hover, or touch) drives the fixed
    // detail box below the chart instead of a floating tooltip. When
    // `isActive` (this milestone is the one currently shown in the detail
    // box), the marker lifts up slightly and the badge gets a darker/thicker
    // ring, so it's clear which marker is selected - especially useful on
    // touch devices with no hover state.
    function MilestoneStar({ cx, cy, milestone, onSelect, isActive }) {
      if (typeof cx !== 'number' || typeof cy !== 'number') return null;

      const select = () => onSelect(milestone);
      const lift = isActive ? -4 : 0;

      return (
        <g
          style={{ cursor: 'pointer' }}
          onMouseEnter={select}
          onClick={select}
          onTouchStart={select}
        >
          {/* Larger invisible hit area so the marker is easy to select. Kept
              at the un-lifted position so the tap target doesn't drift. */}
          <circle cx={cx} cy={cy} r={14} fill="transparent" />
          <g
            style={{
              transform: 'translateY(' + lift + 'px)',
              transition: 'transform 150ms ease-out',
            }}
          >
            <circle
              cx={cx}
              cy={cy}
              r={isActive ? 10 : 9}
              fill="#a855f7"
              stroke="#7e22ce"
              strokeWidth={isActive ? 2.5 : 1}
              style={{ transition: 'r 150ms ease-out, stroke-width 150ms ease-out' }}
            />
            <g transform={"translate(" + (cx - 6) + "," + (cy - 6) + ")"} color="#ffffff">
              <MilestoneIcon iconKey={milestone.icon} size={12} />
            </g>
          </g>
        </g>
      );
    }

    // Custom X-axis tick mark. Month ticks are drawn noticeably longer
    // (and with a labeled month) than the in-between week ticks, so the
    // two tick types are visually distinct at a glance.
    function XAxisTick({ x, y, isMonthTick, label, isDark }) {
      const tickLength = isMonthTick ? 10 : 4;
      return (
        <g transform={"translate(" + x + "," + y + ")"}>
          <line
            x1={0}
            y1={0}
            x2={0}
            y2={tickLength}
            stroke={isDark ? '#64748b' : '#94a3b8'}
            strokeWidth={isMonthTick ? 1.5 : 1}
          />
          {label && (
            <text x={0} y={tickLength + 12} textAnchor="middle" fontSize={12} fill={isDark ? '#94a3b8' : '#64748b'}>
              {label}
            </text>
          )}
        </g>
      );
    }

    // Fixed box shown under the chart with the currently active weight
    // point or milestone. Remounted (via a changing `key` from the caller)
    // whenever the selection changes, so a quick fade/slide-in plays each
    // time without needing separate enter/exit transition bookkeeping.
    function DetailBox({ children }) {
      const [visible, setVisible] = useState(false);

      useEffect(() => {
        setVisible(false);
        const frame = requestAnimationFrame(() => setVisible(true));
        return () => cancelAnimationFrame(frame);
      }, []);

      return (
        <div className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-sm p-4 mb-6 min-h-[132px] flex items-center">
          <div
            className={
              "w-full transition-all duration-150 ease-out motion-reduce:transition-none " +
              (visible ? "opacity-100 translate-y-0" : "opacity-0 translate-y-1")
            }
          >
            {children}
          </div>
        </div>
      );
    }

    function App() {
      const [entries, setEntries] = useState([]);
      const [profile, setProfile] = useState(undefined); // undefined = not yet loaded, null = needs onboarding
      const [isLoading, setIsLoading] = useState(true);
      // PIN gate state: 'loading' while checking with the server, then
      // 'setup' (no PIN configured yet), 'locked' or 'unlocked'.
      const [authStatus, setAuthStatus] = useState('loading');
      const [showProfileModal, setShowProfileModal] = useState(false);
      const [profileForm, setProfileForm] = useState({ name: '', birth_date: '', sex: '' });
      const [newDate, setNewDate] = useState('');
      const [newWeight, setNewWeight] = useState('');
      const [editingId, setEditingId] = useState(null);
      const fileInputRef = useRef(null);
      
      // State for trendline window configuration
      const [trendWindow, setTrendWindow] = useState(3);
      const [predictWeeks, setPredictWeeks] = useState(2);

      // Top-level section tabs: Weight (chart + growth tabs) vs Milestones
      // (milestones tabs), so only one whole section is visible at a time
      // instead of stacking vertically.
      const [mainTab, setMainTab] = useState('weight');

      // Tabbed containers: growth-tracking tabs (unchanged sections, now
      // switchable) and the new milestones tabs.
      const [growthTab, setGrowthTab] = useState('history');
      const [milestoneTab, setMilestoneTab] = useState('history');

      // Developmental milestones state
      const [milestones, setMilestones] = useState([]);
      const [newMilestoneDate, setNewMilestoneDate] = useState('');
      const [newMilestoneDescription, setNewMilestoneDescription] = useState('');
      const [newMilestoneDetails, setNewMilestoneDetails] = useState('');
      const [newMilestoneIcon, setNewMilestoneIcon] = useState('trophy');
      const [editingMilestoneId, setEditingMilestoneId] = useState(null);
      const [expandedMilestoneId, setExpandedMilestoneId] = useState(null);

      // Fixed detail box under the chart: replaces the old floating
      // tooltips. Sticky - keeps showing the last selection instead of
      // clearing when the pointer leaves the chart.
      const [activeDetail, setActiveDetail] = useState(null);

      // Day/night preference: defaults to the system setting, but can be
      // overridden locally via the toggle (persisted in a `theme` cookie
      // so each browser/visitor keeps their own choice).
      const { isDark, toggleTheme } = useTheme();

      const API_URL = '/api/measurements';
      const PROFILE_URL = '/api/profile';
      const MILESTONES_URL = '/api/milestones';

      const birthDate = profile ? profile.birth_date : undefined;

      // Ask the server which screen to show before loading any data. This
      // runs once on mount; the data effect below only fires once unlocked.
      useEffect(() => {
        fetchJson('/api/auth')
          .then(data => setAuthStatus(data.status || 'locked'))
          .catch(() => setAuthStatus('locked'));
      }, []);

      useEffect(() => {
        if (authStatus !== 'unlocked') return;
        setIsLoading(true);
        Promise.all([
          fetchJson(API_URL),
          fetchJson(PROFILE_URL),
          fetchJson(MILESTONES_URL)
        ])
          .then(([measurementsData, profileData, milestonesData]) => {
            if (Array.isArray(measurementsData)) {
              const formattedData = measurementsData.map(d => ({
                ...d,
                date: new Date(d.date).toISOString().split('T')[0]
              }));
              setEntries(formattedData);
            }
            if (Array.isArray(milestonesData)) {
              const formattedMilestones = milestonesData.map(m => ({
                ...m,
                date: new Date(m.date).toISOString().split('T')[0]
              }));
              setMilestones(formattedMilestones);
            }
            setProfile(profileData || null);
          })
          .catch(err => {
            console.error("Failed to fetch measurements, profile, or milestones.", err);
            if (err && err.status === 401) {
              // Session expired or PIN changed - back to the PIN screen.
              setAuthStatus('locked');
              return;
            }
            setProfile(null);
          })
          .finally(() => {
            setIsLoading(false);
          });
      }, [authStatus]);

      const handleCreatePin = (pin) => fetchJson('/api/setup/pin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin })
      }).then(() => setAuthStatus('unlocked'));

      const handleUnlock = (pin) => fetchJson('/api/unlock', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin })
      }).then(() => setAuthStatus('unlocked'));

      useEffect(() => {
        if (profile) {
          document.title = profile.name + "'s Sprog Log";
        }
      }, [profile]);



      const { chartData, xAxisMax, yAxisMax, yAxisMin, milestoneMarkers, xAxisTicks, xAxisMonthTicks } = useMemo(() => {
        if (!birthDate) {
          return { chartData: [], xAxisMax: 0, yAxisMax: 0, yAxisMin: 0, milestoneMarkers: [], xAxisTicks: [], xAxisMonthTicks: new Set() };
        }

        const percentileMilestones = getMilestones(profile && profile.sex);
        const birthTimestamp = new Date(birthDate).getTime();
        const dataPoints = [];

        const sortedEntries = [...entries].sort((a,b) => new Date(a.date).getTime() - new Date(b.date).getTime());
        
        const latestEntryTimestamp = sortedEntries.length > 0 
          ? new Date(sortedEntries[sortedEntries.length - 1].date).getTime()
          : birthTimestamp;
          
        // Extended X-Axis to comfortably fit the dynamically sized projection
        const bufferDays = 4; // Add a few extra days past the final predicted week
        let calculatedXAxisMax = latestEntryTimestamp + ((predictWeeks * 7 + bufferDays) * 24 * 60 * 60 * 1000); 

        // Milestones can be logged well after the most recent weight entry
        // (e.g. logging is behind, or there simply hasn't been a weigh-in
        // since). Extend the visible range so a milestone marker is never
        // silently dropped off the right edge of the chart.
        const latestMilestoneTimestamp = milestones.reduce((max, m) => {
          const t = new Date(m.date).getTime();
          return !isNaN(t) && t > max ? t : max;
        }, -Infinity);
        if (latestMilestoneTimestamp > calculatedXAxisMax) {
          calculatedXAxisMax = latestMilestoneTimestamp + bufferDays * 24 * 60 * 60 * 1000;
        }

        percentileMilestones.forEach((milestone) => {
          const milestoneDate = new Date(birthTimestamp + milestone.months * 30.44 * 24 * 60 * 60 * 1000);
          dataPoints.push({
            timestamp: milestoneDate.getTime(),
            p2: milestone.p2,
            p9: milestone.p9,
            p25: milestone.p25,
            p50: milestone.p50,
            p75: milestone.p75,
            p91: milestone.p91,
            p98: milestone.p98,
          });
        });

        sortedEntries.forEach((entry) => {
          dataPoints.push({
            timestamp: new Date(entry.date).getTime(),
            babyWeight: entry.weight,
          });
        });

        // Generate Trendline predictions passing the flexible trendWindow
        const trend = calculateTrend(sortedEntries, trendWindow);
        let predictedWeights = [];
        
        if (trend) {
          const { slope, intercept, t0 } = trend;
          
          // Plot the trend starting from the exact date of the latest actual entry
          const lastX = (latestEntryTimestamp - t0) / 86400000;
          const trendAtLast = slope * lastX + intercept;
          
          dataPoints.push({
            timestamp: latestEntryTimestamp,
            predictedWeight: Math.round(trendAtLast)
          });
          predictedWeights.push(Math.round(trendAtLast));

          // Plot ghost points at 7-day intervals for the selected number of weeks
          const predictionIntervals = [];
          for (let i = 1; i <= predictWeeks; i++) {
            predictionIntervals.push(i * 7);
          }

          predictionIntervals.forEach(days => {
            const futureTime = latestEntryTimestamp + days * 86400000;
            const futureX = (futureTime - t0) / 86400000;
            const futureWeight = Math.round(slope * futureX + intercept);
            
            dataPoints.push({
              timestamp: futureTime,
              predictedWeight: futureWeight
            });
            predictedWeights.push(futureWeight);
          });
        }

        const sortedData = dataPoints
          .filter(d => !isNaN(d.timestamp))
          .sort((a, b) => a.timestamp - b.timestamp);

        let prevMilestone = percentileMilestones[0];
        let nextMilestone = percentileMilestones[percentileMilestones.length - 1];

        for (let i = 0; i < percentileMilestones.length; i++) {
          const mTime = new Date(birthTimestamp + percentileMilestones[i].months * 30.44 * 24 * 60 * 60 * 1000).getTime();
          if (mTime >= calculatedXAxisMax) {
            nextMilestone = percentileMilestones[i];
            prevMilestone = i > 0 ? percentileMilestones[i - 1] : percentileMilestones[0];
            break;
          }
        }

        const prevTime = new Date(birthTimestamp + prevMilestone.months * 30.44 * 24 * 60 * 60 * 1000).getTime();
        const nextTime = new Date(birthTimestamp + nextMilestone.months * 30.44 * 24 * 60 * 60 * 1000).getTime();
        
        let interpolatedMaxP98 = nextMilestone.p98;
        if (nextTime > prevTime) {
          const fraction = Math.max(0, Math.min(1, (calculatedXAxisMax - prevTime) / (nextTime - prevTime)));
          interpolatedMaxP98 = prevMilestone.p98 + (nextMilestone.p98 - prevMilestone.p98) * fraction;
        }

        let calculatedYAxisMax, calculatedYAxisMin;
        
        if (sortedEntries.length > 0) {
          let maxBabyWeight = Math.max(...sortedEntries.map(e => e.weight));
          let minBabyWeight = Math.min(...sortedEntries.map(e => e.weight));
          
          if (predictedWeights.length > 0) {
            maxBabyWeight = Math.max(maxBabyWeight, ...predictedWeights);
            minBabyWeight = Math.min(minBabyWeight, ...predictedWeights);
          }
          
          const buffer = 1200; 
          calculatedYAxisMax = Math.ceil((maxBabyWeight + buffer) / 500) * 500;
          calculatedYAxisMin = Math.max(0, Math.floor((minBabyWeight - buffer) / 500) * 500);
        } else {
          calculatedYAxisMax = Math.ceil(interpolatedMaxP98 / 500) * 500 + 200;
          calculatedYAxisMin = Math.max(0, Math.floor(percentileMilestones[0].p2 / 500) * 500 - 200);
        }

        // Milestone markers plotted as vertical reference lines. Only keep
        // ones that fall within the visible x-axis range so they don't
        // render clipped/off-chart.
        const dataMinTimestamp = sortedData.length > 0 ? sortedData[0].timestamp : birthTimestamp;
        const milestoneMarkers = milestones
          .map((milestone) => ({
            ...milestone,
            timestamp: new Date(milestone.date).getTime()
          }))
          .filter((m) => !isNaN(m.timestamp) && m.timestamp >= dataMinTimestamp && m.timestamp <= calculatedXAxisMax);

        // Build explicit X-axis ticks instead of letting recharts derive
        // them from the (irregularly spaced) data points, which produced a
        // mash of unevenly spaced calendar dates. A labeled tick is placed
        // at every whole month of age, with lighter unlabeled tick marks
        // at every week in between for finer-grained reference. Month tick
        // timestamps are tracked in a set so the label formatter can match
        // them exactly, rather than relying on a numeric tolerance that
        // could also match a nearby week tick.
        const oneWeekMs = 7 * 24 * 60 * 60 * 1000;
        const oneMonthMs = 30.4375 * 24 * 60 * 60 * 1000;
        const totalMonths = Math.max(0, Math.ceil((calculatedXAxisMax - birthTimestamp) / oneMonthMs));
        const totalWeeks = Math.max(0, Math.ceil((calculatedXAxisMax - birthTimestamp) / oneWeekMs));

        const xAxisMonthTicks = new Set();
        for (let m = 0; m <= totalMonths; m++) {
          xAxisMonthTicks.add(birthTimestamp + m * oneMonthMs);
        }
        const weekTickTimestamps = [];
        for (let w = 0; w <= totalWeeks; w++) {
          weekTickTimestamps.push(birthTimestamp + w * oneWeekMs);
        }

        const xAxisTicks = Array.from(new Set([...xAxisMonthTicks, ...weekTickTimestamps]))
          .filter((t) => t <= calculatedXAxisMax)
          .sort((a, b) => a - b);

        return { 
          chartData: sortedData,
          xAxisMax: calculatedXAxisMax,
          yAxisMax: calculatedYAxisMax,
          yAxisMin: calculatedYAxisMin,
          milestoneMarkers,
          xAxisTicks,
          xAxisMonthTicks
        };
      }, [entries, birthDate, profile, trendWindow, predictWeeks, milestones]);

      // Seed the fixed detail box with the most recent weight point once
      // the chart data is available, so the box is never empty on first
      // paint. Only runs while nothing has been selected yet.
      useEffect(() => {
        if (activeDetail || chartData.length === 0) return;
        const weightPoints = chartData.filter((d) => d.babyWeight != null);
        if (weightPoints.length > 0) {
          setActiveDetail({ kind: 'weight', point: weightPoints[weightPoints.length - 1] });
        }
      }, [chartData, activeDetail]);

      const handleAddEntry = async (e) => {
        e.preventDefault();
        if (!newDate || !newWeight) return;
        
        try {
          if (editingId) {
            const res = await fetch(API_URL + '/' + editingId, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ date: newDate, weight: Number(newWeight) })
            });
            const updatedEntry = await res.json();
            updatedEntry.date = new Date(updatedEntry.date).toISOString().split('T')[0];
            
            setEntries(entries.map(entry => entry.id === editingId ? updatedEntry : entry));
            setEditingId(null);
          } else {
            const res = await fetch(API_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ date: newDate, weight: Number(newWeight) })
            });
            const newEntry = await res.json();
            newEntry.date = new Date(newEntry.date).toISOString().split('T')[0];

            setEntries([...entries, newEntry]);
          }
          setNewDate('');
          setNewWeight('');
        } catch (error) {
          alert("Failed to save entry. Check the console for errors.");
          console.error(error);
        }
      };

      const handleEdit = (entry) => {
        setNewDate(entry.date);
        setNewWeight(entry.weight);
        setEditingId(entry.id);
      };

      const handleDelete = async (id) => {
        try {
          await fetch(API_URL + '/' + id, { method: 'DELETE' });
          setEntries(entries.filter(entry => entry.id !== id));
          if (editingId === id) {
            setEditingId(null);
            setNewDate('');
            setNewWeight('');
          }
        } catch (error) {
          alert("Failed to delete entry.");
          console.error(error);
        }
      };

      const handleMilestoneSubmit = async (e) => {
        e.preventDefault();
        if (!newMilestoneDate || !newMilestoneDescription.trim()) return;

        const body = {
          date: newMilestoneDate,
          description: newMilestoneDescription.trim(),
          details: newMilestoneDetails.trim(),
          icon: newMilestoneIcon
        };

        try {
          if (editingMilestoneId) {
            const res = await fetch(MILESTONES_URL + '/' + editingMilestoneId, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body)
            });
            if (!res.ok) {
              const err = await res.json().catch(() => ({}));
              alert(err.error || 'Failed to update milestone.');
              return;
            }
            const updatedMilestone = await res.json();
            updatedMilestone.date = new Date(updatedMilestone.date).toISOString().split('T')[0];

            setMilestones(milestones.map(m => m.id === editingMilestoneId ? updatedMilestone : m));
            setActiveDetail((prev) => (prev && prev.kind === 'milestone' && prev.milestone.id === editingMilestoneId)
              ? { kind: 'milestone', milestone: updatedMilestone }
              : prev);
            setEditingMilestoneId(null);
          } else {
            const res = await fetch(MILESTONES_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body)
            });
            if (!res.ok) {
              const err = await res.json().catch(() => ({}));
              alert(err.error || 'Failed to add milestone.');
              return;
            }
            const newMilestone = await res.json();
            newMilestone.date = new Date(newMilestone.date).toISOString().split('T')[0];

            setMilestones([...milestones, newMilestone]);
          }
          setNewMilestoneDate('');
          setNewMilestoneDescription('');
          setNewMilestoneDetails('');
          setNewMilestoneIcon('trophy');
        } catch (error) {
          alert("Failed to save milestone. Check the console for errors.");
          console.error(error);
        }
      };

      const handleMilestoneEdit = (milestone) => {
        setNewMilestoneDate(milestone.date);
        setNewMilestoneDescription(milestone.description);
        setNewMilestoneDetails(milestone.details || '');
        setNewMilestoneIcon(milestone.icon || 'trophy');
        setEditingMilestoneId(milestone.id);
        setMilestoneTab('add');
      };

      const handleMilestoneCancelEdit = () => {
        setEditingMilestoneId(null);
        setNewMilestoneDate('');
        setNewMilestoneDescription('');
        setNewMilestoneDetails('');
        setNewMilestoneIcon('trophy');
      };

      const handleMilestoneDelete = async (id) => {
        try {
          await fetch(MILESTONES_URL + '/' + id, { method: 'DELETE' });
          setMilestones(milestones.filter(m => m.id !== id));
          if (editingMilestoneId === id) {
            handleMilestoneCancelEdit();
          }
          setActiveDetail((prev) => (prev && prev.kind === 'milestone' && prev.milestone.id === id) ? null : prev);
          if (expandedMilestoneId === id) setExpandedMilestoneId(null);
        } catch (error) {
          alert("Failed to delete milestone.");
          console.error(error);
        }
      };

      const handleExport = () => {
        const dataToSave = {
          profile: profile ? { name: profile.name, birth_date: profile.birth_date, sex: profile.sex } : null,
          entries
        };
        const jsonString = JSON.stringify(dataToSave, null, 2);
        const blob = new Blob([jsonString], { type: 'application/json' });
        const url = URL.createObjectURL(blob);

        const slug = (profile && profile.name ? profile.name : '')
          .trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'child';

        const link = document.createElement('a');
        link.href = url;
        link.download = slug + '-weight-data.json';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      };

      const handleProfileSubmit = async (formValues) => {
        try {
          const res = await fetch(PROFILE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formValues)
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            alert(err.error || 'Failed to save profile.');
            return;
          }
          const savedProfile = await res.json();
          setProfile(savedProfile);
          setShowProfileModal(false);
        } catch (error) {
          alert("Failed to save profile. Check the console for errors.");
          console.error(error);
        }
      };

      const openSettingsModal = () => {
        if (profile) {
          setProfileForm({ name: profile.name, birth_date: profile.birth_date, sex: profile.sex });
        }
        setShowProfileModal(true);
      };

      const handleImport = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (event) => {
          try {
            const importedData = JSON.parse(event.target.result);
            
            if (importedData.entries && Array.isArray(importedData.entries)) {
              setIsLoading(true);

              // Support both the new { profile, entries } shape and the
              // legacy { birthDate, entries } shape from older exports.
              // Only apply an imported profile if none exists yet; never
              // silently overwrite an existing profile.
              if (!profile) {
                if (importedData.profile && importedData.profile.name && importedData.profile.birth_date && importedData.profile.sex) {
                  await handleProfileSubmit(importedData.profile);
                } else if (importedData.birthDate) {
                  // Legacy export has no name/sex; leave onboarding to the user.
                }
              }

              for (const entry of importedData.entries) {
                await fetch(API_URL, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ date: entry.date, weight: Number(entry.weight) })
                });
              }
              const res = await fetch(API_URL);
              const data = await res.json();
              if (Array.isArray(data)) {
                const formattedData = data.map(d => ({
                  ...d,
                  date: new Date(d.date).toISOString().split('T')[0]
                }));
                setEntries(formattedData);
              }
              setIsLoading(false);
              alert("Import successful! Data is now saved to the database.");
            }
          } catch (error) {
            console.error("Import error:", error);
            alert("Failed to read the file or save to the database.");
            setIsLoading(false);
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      const formatDate = (timestamp) => {
        if (isNaN(timestamp)) return '';
        return new Date(timestamp).toLocaleDateString('en-US', { 
          month: 'short', day: 'numeric', year: 'numeric' 
        });
      };

      // Formats a 'YYYY-MM-DD' date-only string without ever converting it
      // through a local-timezone Date, so the displayed calendar day cannot
      // shift by one day in negative UTC-offset browsers.
      const formatDateOnly = (isoDate) => {
        if (!isoDate) return '';
        const [y, m, d] = isoDate.split('-').map(Number);
        return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString('en-US', {
          month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC'
        });
      };

      // Labels only the ticks that fall exactly on a whole month of age
      // (e.g. "1mo", "2mo"); the in-between weekly ticks are rendered as
      // unlabeled marks so the axis reads as regular month/week ticks
      // instead of a mash of irregular calendar dates.
      const formatAxisDate = (timestamp) => {
        if (isNaN(timestamp) || !birthDate || !xAxisMonthTicks.has(timestamp)) return '';
        const oneMonthMs = 30.4375 * 24 * 60 * 60 * 1000;
        const ageMonths = Math.round((timestamp - new Date(birthDate).getTime()) / oneMonthMs);
        return ageMonths === 0 ? 'Birth' : ageMonths + 'mo';
      };

      const formatLbsOz = (grams) => {
        if (!grams) return '';
        const totalOunces = grams / 28.34952;
        let lbs = Math.floor(totalOunces / 16);
        let oz = Math.round(totalOunces % 16);
        if (oz === 16) {
          lbs += 1;
          oz = 0;
        }
        return lbs + "lb " + oz + "oz";
      };

      // Builds the content shown inside the fixed detail box for whichever
      // point/milestone is currently active. Returns null when there's
      // nothing to show yet (e.g. no data logged at all).
      const renderDetailContent = () => {
        if (!activeDetail) {
          return (
            <p className="text-sm text-slate-400 dark:text-slate-500">Hover or tap a point on the chart to see details.</p>
          );
        }

        if (activeDetail.kind === 'milestone') {
          const milestone = activeDetail.milestone;
          return (
            <div>
              <p className="font-semibold text-purple-700 dark:text-purple-400 mb-1 flex items-center gap-2">
                <span className="flex items-center justify-center w-6 h-6 rounded-full bg-purple-100 dark:bg-purple-900/50 text-purple-600 dark:text-purple-400 shrink-0">
                  <MilestoneIcon iconKey={milestone.icon} size={14} />
                </span>
                <span>{formatDateOnly(milestone.date)}</span>
              </p>
              <p className="text-slate-800 dark:text-slate-100 font-medium mb-1">{milestone.description}</p>
              {milestone.details && (
                <p className="text-sm text-slate-600 dark:text-slate-300 whitespace-pre-wrap">{milestone.details}</p>
              )}
            </div>
          );
        }

        const point = activeDetail.point;
        const ageInDays = (point.timestamp - new Date(birthDate).getTime()) / 86400000;
        const sex = profile && profile.sex;
        const centileRows = [
          { key: 'p98', label: '98th' },
          { key: 'p91', label: '91st' },
          { key: 'p75', label: '75th' },
          { key: 'p50', label: '50th' },
          { key: 'p25', label: '25th' },
          { key: 'p9', label: '9th' },
          { key: 'p2', label: '2nd' },
        ].filter((row) => point[row.key] != null);

        return (
          <div className="flex flex-col gap-3">
            <p className="font-semibold text-slate-700 dark:text-slate-300">{formatDate(point.timestamp)}</p>
            <div className="flex flex-wrap gap-4">
              {point.babyWeight != null && (
                <div className="border-l-2 border-indigo-600 dark:border-indigo-400 pl-2">
                  <span className="block font-bold text-indigo-600 dark:text-indigo-400 text-xs uppercase tracking-wide mb-0.5">{profile.name}'s Weight</span>
                  <span className="block text-slate-800 dark:text-slate-100 font-medium">{point.babyWeight}g &middot; {formatLbsOz(point.babyWeight)}</span>
                  <span className="block text-blue-600 dark:text-blue-400 font-medium text-sm">{getExactCentile(point.babyWeight, ageInDays, sex)} Centile</span>
                </div>
              )}
              {point.predictedWeight != null && (
                <div className="border-l-2 border-orange-500 pl-2">
                  <span className="block font-bold text-orange-500 dark:text-orange-400 text-xs uppercase tracking-wide mb-0.5">Predicted Trend</span>
                  <span className="block text-slate-800 dark:text-slate-100 font-medium">{point.predictedWeight}g &middot; {formatLbsOz(point.predictedWeight)}</span>
                  <span className="block text-orange-500 dark:text-orange-400 font-medium text-sm">{getExactCentile(point.predictedWeight, ageInDays, sex)} Centile</span>
                </div>
              )}
            </div>
            {centileRows.length > 0 && (
              <div className="flex flex-wrap gap-x-4 gap-y-1 pt-2 border-t border-slate-100 dark:border-slate-700">
                {centileRows.map((row) => (
                  <span key={row.key} className="text-xs text-slate-500 dark:text-slate-400">
                    {row.label} centile: <span className="font-medium text-slate-600 dark:text-slate-300">{point[row.key]}g</span>
                  </span>
                ))}
              </div>
            )}
          </div>
        );
      };

      // PIN gate: shown before any tracker UI or data. 'loading' means the
      // auth status check is still in flight.
      if (authStatus === 'loading') {
        return (
          <div className="w-full min-h-screen flex justify-center items-center text-slate-500 dark:text-slate-400 text-sm">
            <ThemeToggle isDark={isDark} onToggle={toggleTheme} />
            Loading...
          </div>
        );
      }

      if (authStatus === 'setup') {
        return (
          <PinScreen
            title="Welcome! Set up your PIN"
            subtitle="Choose a PIN (at least 4 characters) to protect this log. Anyone with the PIN can view and edit it, so keep it to yourselves."
            submitLabel="Save PIN"
            confirm
            onSubmit={handleCreatePin}
          />
        );
      }

      if (authStatus === 'locked') {
        return (
          <PinScreen
            title="Enter your PIN"
            subtitle="This log is PIN protected."
            submitLabel="Unlock"
            onSubmit={handleUnlock}
          />
        );
      }

      if (isLoading) {
        return (
          <div className="w-full min-h-screen flex justify-center items-center text-slate-500 dark:text-slate-400 text-sm">
            <ThemeToggle isDark={isDark} onToggle={toggleTheme} />
            Loading...
          </div>
        );
      }

      if (profile === null || showProfileModal) {
        return (
          <ProfileModal
            initialValues={profile ? profileForm : { name: '', birth_date: '', sex: '' }}
            dismissable={!!profile}
            onCancel={() => setShowProfileModal(false)}
            onSubmit={handleProfileSubmit}
          />
        );
      }

      return (
        <div className="w-full min-h-screen p-1 md:p-6 font-sans flex justify-center items-start text-slate-800 dark:text-slate-100">
          <ThemeToggle isDark={isDark} onToggle={toggleTheme} />
          <div className="w-full max-w-4xl md:bg-white dark:md:bg-slate-800 md:rounded-2xl md:shadow-sm md:border md:border-slate-200 dark:md:border-slate-700 p-2 md:p-6">
            
            <div className="flex flex-col md:flex-row md:justify-between md:items-end gap-4 mb-8">
              <div className="flex items-start gap-3">
                <div>
                  <h1 className="text-2xl font-bold tracking-tight">{profile.name}'s Sprog Log</h1>
                </div>
                <button
                  onClick={openSettingsModal}
                  className="p-2 text-slate-400 dark:text-slate-500 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-950/40 rounded-md transition-colors"
                  title="Edit profile"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>
              </div>
              <div className="flex flex-col md:text-right">
                <label className="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">
                  {profile.name}'s Birthdate
                </label>
                <div className="text-slate-800 dark:text-slate-100 font-medium">
                  {formatDateOnly(profile.birth_date)}
                </div>
              </div>
            </div>

            {profile.sex === 'male' && (
              <div className="mb-6 bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800 text-amber-800 dark:text-amber-300 text-sm rounded-lg px-4 py-3">
                Reference centiles shown are WHO girls data. Boys reference data is not yet included.
              </div>
            )}

            {/* The growth chart is a permanent fixture and always stays at
                the top, above the Weight/Milestones tabbed container. */}
            <div className="relative h-[400px] w-full mb-4 md:bg-slate-50/50 dark:md:bg-slate-800/40 md:rounded-xl p-0 md:p-2 md:border md:border-slate-100 dark:md:border-slate-700">
              <ResponsiveContainer width="100%" height="100%">
                <LineChart
                  data={chartData}
                  margin={{ top: 20, right: 12, left: 0, bottom: 0 }}
                  onMouseMove={(state) => {
                    if (state && state.activeTooltipIndex != null) {
                      const point = chartData[state.activeTooltipIndex];
                      if (point && (point.babyWeight != null || point.predictedWeight != null || point.p50 != null)) {
                        setActiveDetail({ kind: 'weight', point });
                      }
                    }
                  }}
                >
                  <CartesianGrid strokeDasharray="3 3" vertical={false} stroke={isDark ? '#334155' : '#e2e8f0'} />
                  
                  <XAxis 
                    dataKey="timestamp" 
                    type="number" 
                    domain={['dataMin', xAxisMax]} 
                    allowDataOverflow={true}
                    ticks={xAxisTicks}
                    interval={0}
                    stroke={isDark ? '#64748b' : '#94a3b8'}
                    tickLine={false}
                    tick={(props) => (
                      <XAxisTick
                        {...props}
                        isMonthTick={xAxisMonthTicks.has(props.payload.value)}
                        label={formatAxisDate(props.payload.value)}
                        isDark={isDark}
                      />
                    )}
                    tickMargin={0}
                    height={40}
                    scale="time"
                  />
                  <YAxis 
                    domain={[yAxisMin, yAxisMax]}
                    allowDataOverflow={true}
                    tickFormatter={(val) => (val / 1000) + "kg"}
                    stroke={isDark ? '#64748b' : '#94a3b8'}
                    tick={{ fill: isDark ? '#94a3b8' : '#64748b', fontSize: 12 }}
                    tickMargin={4}
                    width={34}
                  />
                  
                  {/* Renders nothing itself, but keeps Recharts tracking the
                      active point on hover/touch (activeTooltipIndex) so the
                      fixed detail box below the chart can be driven from
                      onMouseMove instead of a floating tooltip. */}
                  <Tooltip content={() => null} cursor={{ stroke: '#cbd5e1', strokeDasharray: '3 3' }} />
                  <Legend wrapperStyle={{ paddingTop: '20px' }} iconType="circle" />

                  {/* Standard UK-WHO Centiles */}
                  <Line name="98th" type="monotone" dataKey="p98" stroke={isDark ? '#475569' : '#cbd5e1'} strokeWidth={2} dot={false} connectNulls />
                  <Line name="91st" type="monotone" dataKey="p91" stroke={isDark ? '#334155' : '#e2e8f0'} strokeWidth={2} dot={false} connectNulls />
                  <Line name="75th" type="monotone" dataKey="p75" stroke={isDark ? '#64748b' : '#94a3b8'} strokeWidth={2} dot={false} connectNulls />
                  <Line name="50th" type="monotone" dataKey="p50" stroke="#10b981" strokeWidth={2} strokeDasharray="5 5" dot={false} connectNulls />
                  <Line name="25th" type="monotone" dataKey="p25" stroke={isDark ? '#64748b' : '#94a3b8'} strokeWidth={2} dot={false} connectNulls />
                  <Line name="9th" type="monotone" dataKey="p9" stroke={isDark ? '#334155' : '#e2e8f0'} strokeWidth={2} dot={false} connectNulls />
                  <Line name="2nd" type="monotone" dataKey="p2" stroke={isDark ? '#475569' : '#cbd5e1'} strokeWidth={2} dot={false} connectNulls />

                  {/* Prediction Line */}
                  <Line 
                    name="Predicted Trend"
                    type="linear" 
                    dataKey="predictedWeight" 
                    stroke="#f97316" 
                    strokeWidth={2} 
                    strokeDasharray="5 5"
                    dot={{ r: 4, strokeWidth: 2, fill: '#fff', stroke: '#f97316' }} 
                    activeDot={{ r: 6, strokeWidth: 0, fill: '#f97316' }}
                    connectNulls 
                  />

                  {/* Actual Weight Line */}
                  <Line 
                    name={profile.name + "'s Weight"}
                    type="monotone" 
                    dataKey="babyWeight" 
                    stroke="#6366f1" 
                    strokeWidth={4} 
                    dot={{ r: 5, strokeWidth: 2, fill: '#fff' }} 
                    activeDot={{ r: 7, strokeWidth: 0, fill: '#4f46e5' }}
                    connectNulls 
                  />

                  {/* Developmental milestone markers: a vertical line at the
                      milestone's date, with an icon marker at the top of the
                      plot area. Selecting the marker (hover, click, or
                      touch) drives the fixed detail box below the chart. */}
                  {milestoneMarkers.map((milestone) => {
                    const isActive = activeDetail && activeDetail.kind === 'milestone' && activeDetail.milestone.id === milestone.id;
                    return (
                      <ReferenceLine
                        key={'milestone-line-' + milestone.id}
                        x={milestone.timestamp}
                        stroke="#a855f7"
                        strokeDasharray="4 4"
                        strokeWidth={isActive ? 3 : 1.5}
                        style={{ transition: 'stroke-width 150ms ease-out' }}
                      />
                    );
                  })}
                  {milestoneMarkers.map((milestone) => {
                    const isActive = activeDetail && activeDetail.kind === 'milestone' && activeDetail.milestone.id === milestone.id;
                    return (
                      <ReferenceDot
                        key={'milestone-star-' + milestone.id}
                        x={milestone.timestamp}
                        y={yAxisMax}
                        r={0}
                        isFront={true}
                        shape={(shapeProps) => (
                          <MilestoneStar
                            {...shapeProps}
                            milestone={milestone}
                            isActive={isActive}
                            onSelect={(m) => setActiveDetail({ kind: 'milestone', milestone: m })}
                          />
                        )}
                      />
                    );
                  })}
                </LineChart>
              </ResponsiveContainer>
            </div>

            {/* Fixed detail box: replaces the old floating tooltips for both
                weight points and milestone markers. Sticky - keeps showing
                the last selection instead of clearing on mouse leave, with
                a fast cross-fade when the content changes. */}
            <DetailBox key={activeDetail ? activeDetail.kind + '-' + (activeDetail.kind === 'milestone' ? activeDetail.milestone.id : activeDetail.point.timestamp) : 'empty'}>
              {renderDetailContent()}
            </DetailBox>

            {/* Weight / Milestones tabbed container: these top-level tabs
                are styled as attached page tabs (flat, underlined, sitting
                on the container's own header strip) so it's visually clear
                they control everything inside this box below. This is a
                distinct style from the pill-shaped sub-tabs inside each
                panel (Prediction Settings / Add Measurement / History,
                etc.), which only switch content within the active panel. */}
            <div className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-sm overflow-hidden">
              <div className="flex bg-slate-50 dark:bg-slate-800/60 border-b border-slate-200 dark:border-slate-700">
                {[
                  { key: 'weight', label: 'Weight' },
                  { key: 'milestones', label: 'Milestones' }
                ].map((tab) => (
                  <button
                    key={tab.key}
                    type="button"
                    onClick={() => setMainTab(tab.key)}
                    className={
                      "px-5 py-3 text-sm font-semibold tracking-wide border-b-2 -mb-px transition-colors " +
                      (mainTab === tab.key
                        ? "bg-white dark:bg-slate-800 border-indigo-600 dark:border-indigo-400 text-indigo-600 dark:text-indigo-400"
                        : "border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700")
                    }
                  >
                    {tab.label}
                  </button>
                ))}
              </div>

              <div className="p-4 md:p-6">
              {mainTab === 'weight' && (
              <React.Fragment>
              {/* Growth tracking tabs: prediction settings / add measurement / history */}
              <TabBar
                tabs={[
                  { key: 'prediction', label: 'Prediction Settings' },
                  { key: 'add', label: 'Add Measurement' },
                  { key: 'history', label: 'History' }
                ]}
                activeKey={growthTab}
                onChange={setGrowthTab}
              />

              {growthTab === 'prediction' && (
                <div className="bg-orange-50/50 dark:bg-orange-950/20 p-4 md:p-5 rounded-xl border border-orange-100 dark:border-orange-800/60 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                  <div className="flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f97316" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                    <div className="text-sm font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wide">Growth Prediction Settings</div>
                  </div>
                  <div className="flex flex-wrap gap-3 w-full sm:w-auto">
                    <label className="text-sm font-medium text-slate-600 dark:text-slate-300 flex items-center gap-2 bg-white dark:bg-slate-800 px-3 py-2 rounded-lg border border-orange-200 dark:border-orange-800 shadow-sm flex-1 sm:flex-none justify-center">
                      Based on last
                      <input 
                        type="number" 
                        min="2" 
                        max="50"
                        value={trendWindow}
                        onChange={(e) => setTrendWindow(parseInt(e.target.value) || 2)}
                        className="w-12 px-1 py-0.5 text-center border border-slate-300 dark:border-slate-600 rounded outline-none focus:ring-2 focus:ring-orange-500 bg-slate-50 dark:bg-slate-800/60"
                      />
                      entries
                    </label>
                    <label className="text-sm font-medium text-slate-600 dark:text-slate-300 flex items-center gap-2 bg-white dark:bg-slate-800 px-3 py-2 rounded-lg border border-orange-200 dark:border-orange-800 shadow-sm flex-1 sm:flex-none justify-center">
                      Project
                      <input 
                        type="number" 
                        min="1" 
                        max="12"
                        value={predictWeeks}
                        onChange={(e) => setPredictWeeks(parseInt(e.target.value) || 1)}
                        className="w-12 px-1 py-0.5 text-center border border-slate-300 dark:border-slate-600 rounded outline-none focus:ring-2 focus:ring-orange-500 bg-slate-50 dark:bg-slate-800/60"
                      />
                      weeks
                    </label>
                  </div>
                </div>
              )}

              {growthTab === 'add' && (
                <div className="bg-slate-50 dark:bg-slate-800/60 p-5 md:p-6 rounded-xl border border-slate-200 dark:border-slate-700">
                  <h2 className="text-sm font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wide mb-4">Add New Measurement</h2>
                  <form onSubmit={handleAddEntry} className="flex flex-col sm:flex-row gap-4 items-end">
                    <div className="flex-1 w-full">
                      <label className="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1.5">Date Measured</label>
                      <input 
                        type="date" 
                        required
                        value={newDate}
                        onChange={(e) => setNewDate(e.target.value)}
                        className="w-full px-4 py-2.5 border border-slate-300 dark:border-slate-600 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 transition-all bg-white dark:bg-slate-800"
                      />
                    </div>
                    <div className="flex-1 w-full">
                      <label className="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1.5">Weight (in grams)</label>
                      <input 
                        type="number" 
                        required
                        min="0"
                        step="10"
                        placeholder="e.g. 4500"
                        value={newWeight}
                        onChange={(e) => setNewWeight(e.target.value)}
                        className="w-full px-4 py-2.5 border border-slate-300 dark:border-slate-600 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 transition-all bg-white dark:bg-slate-800"
                      />
                    </div>
                    <div className="flex gap-2 w-full sm:w-auto">
                      <button 
                        type="submit"
                        className="flex-1 sm:flex-none px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg shadow-sm transition-colors focus:ring-4 focus:ring-indigo-500/30 outline-none whitespace-nowrap"
                      >
                        {editingId ? 'Update' : 'Log Weight'}
                      </button>
                      {editingId && (
                        <button 
                          type="button"
                          onClick={() => {
                            setEditingId(null);
                            setNewDate('');
                            setNewWeight('');
                          }}
                          className="flex-1 sm:flex-none px-6 py-2.5 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-300 font-medium rounded-lg shadow-sm transition-colors outline-none whitespace-nowrap"
                        >
                          Cancel
                        </button>
                      )}
                    </div>
                  </form>
                </div>
              )}

              {growthTab === 'history' && (
                <div className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl overflow-hidden shadow-sm">
                  <div className="bg-slate-50 dark:bg-slate-800/60 border-b border-slate-200 dark:border-slate-700 px-5 py-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div className="flex items-center gap-3">
                      <h2 className="text-sm font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wide">Measurement History</h2>
                      <span className="text-xs font-medium text-slate-500 dark:text-slate-400 bg-slate-200 dark:bg-slate-700 px-2 py-1 rounded-full">{entries.length} records</span>
                      {isLoading && <span className="text-xs text-indigo-500 dark:text-indigo-400 animate-pulse ml-2">Loading DB...</span>}
                    </div>
                    
                    <div className="flex gap-2 w-full sm:w-auto">
                      <button 
                        onClick={handleExport}
                        className="flex-1 sm:flex-none flex items-center justify-center gap-2 px-3 py-1.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-300 text-sm font-medium rounded shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700/60 transition-colors"
                      >
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        Export JSON
                      </button>
                      
                      <button 
                        onClick={() => fileInputRef.current?.click()}
                        className="flex-1 sm:flex-none flex items-center justify-center gap-2 px-3 py-1.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-300 text-sm font-medium rounded shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700/60 transition-colors"
                      >
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        Import JSON
                      </button>
                      <input 
                        type="file" 
                        accept=".json" 
                        ref={fileInputRef} 
                        onChange={handleImport} 
                        className="hidden" 
                      />
                    </div>
                  </div>
                  
                  {entries.length === 0 ? (
                    <div className="p-8 text-center text-slate-500 dark:text-slate-400 text-sm">No measurements logged yet.</div>
                  ) : (
                    <div className="divide-y divide-slate-100 dark:divide-slate-700">
                      {[...entries].sort((a, b) => new Date(b.date).getTime() - new Date(a.date).getTime()).map((entry) => {
                        const ageInDays = (new Date(entry.date).getTime() - new Date(birthDate).getTime()) / 86400000;
                        const exactCentile = getExactCentile(entry.weight, ageInDays, profile.sex);

                        return (
                          <div key={entry.id} className="flex flex-col sm:flex-row justify-between items-start sm:items-center px-5 py-3 hover:bg-slate-50 dark:hover:bg-slate-700/60 transition-colors gap-3">
                            <span className="font-medium text-slate-800 dark:text-slate-100 shrink-0">
                              {new Date(entry.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}
                            </span>
                            
                            <div className="flex flex-wrap gap-2 flex-1 sm:justify-end">
                              <span className="text-indigo-600 dark:text-indigo-400 font-semibold bg-indigo-50 dark:bg-indigo-950/40 px-2 py-0.5 rounded text-sm inline-block w-fit">
                                {entry.weight}g
                              </span>
                              <span className="text-emerald-600 dark:text-emerald-400 font-semibold bg-emerald-50 dark:bg-emerald-950/40 px-2 py-0.5 rounded text-sm inline-block w-fit">
                                {formatLbsOz(entry.weight)}
                              </span>
                              <span className="text-blue-600 dark:text-blue-400 font-semibold bg-blue-50 dark:bg-blue-950/40 px-2 py-0.5 rounded text-sm inline-block w-fit">
                                {exactCentile} Centile
                              </span>
                            </div>

                            <div className="flex items-center gap-2 shrink-0 self-end sm:self-auto">
                              <button 
                                onClick={() => handleEdit(entry)}
                                className="p-1.5 text-slate-400 dark:text-slate-500 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-950/40 rounded-md transition-colors"
                                title="Edit"
                              >
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                              </button>
                              <button 
                                onClick={() => handleDelete(entry.id)}
                                className="p-1.5 text-slate-400 dark:text-slate-500 hover:text-red-600 dark:hover:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/40 rounded-md transition-colors"
                                title="Delete"
                              >
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                              </button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}
              </React.Fragment>
            )}

            {mainTab === 'milestones' && (
              <React.Fragment>
              {/* Developmental milestones tabs: add milestone / history */}
              <TabBar
                tabs={[
                  { key: 'add', label: 'Add Milestone' },
                  { key: 'history', label: 'History' }
                ]}
                activeKey={milestoneTab}
                onChange={setMilestoneTab}
              />

              {milestoneTab === 'add' && (
                <div className="bg-purple-50/50 dark:bg-purple-950/20 p-5 md:p-6 rounded-xl border border-purple-100 dark:border-purple-800/60">
                  <h2 className="text-sm font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wide mb-4">Add New Milestone</h2>
                  <form onSubmit={handleMilestoneSubmit} className="flex flex-col gap-4">
                    <div className="flex flex-col sm:flex-row gap-4 sm:items-end">
                      <div className="shrink-0 self-start">
                        <label className="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1.5">Icon</label>
                        <IconPicker value={newMilestoneIcon} onChange={setNewMilestoneIcon} />
                      </div>
                      <div className="w-full sm:w-48 shrink-0">
                        <label className="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1.5">Date</label>
                        <input 
                          type="date" 
                          required
                          value={newMilestoneDate}
                          onChange={(e) => setNewMilestoneDate(e.target.value)}
                          className="w-full px-4 py-2.5 border border-slate-300 dark:border-slate-600 rounded-lg outline-none focus:ring-2 focus:ring-purple-500 transition-all bg-white dark:bg-slate-800"
                        />
                      </div>
                      <div className="flex-1 w-full">
                        <label className="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1.5">Title</label>
                        <input 
                          type="text" 
                          required
                          maxLength={200}
                          placeholder="e.g. Rolled for the first time."
                          value={newMilestoneDescription}
                          onChange={(e) => setNewMilestoneDescription(e.target.value)}
                          className="w-full px-4 py-2.5 border border-slate-300 dark:border-slate-600 rounded-lg outline-none focus:ring-2 focus:ring-purple-500 transition-all bg-white dark:bg-slate-800"
                        />
                      </div>
                    </div>

                    <div>
                      <div className="flex justify-between items-baseline mb-1.5">
                        <label className="block text-sm font-medium text-slate-600 dark:text-slate-300">Details <span className="text-slate-400 dark:text-slate-500 font-normal">(optional)</span></label>
                        <span className="text-xs text-slate-400 dark:text-slate-500">{newMilestoneDetails.length}/2000</span>
                      </div>
                      <textarea
                        rows={4}
                        maxLength={2000}
                        placeholder="What happened? Any extra detail you want to remember."
                        value={newMilestoneDetails}
                        onChange={(e) => setNewMilestoneDetails(e.target.value)}
                        className="w-full px-4 py-2.5 border border-slate-300 dark:border-slate-600 rounded-lg outline-none focus:ring-2 focus:ring-purple-500 transition-all bg-white dark:bg-slate-800 resize-y"
                      />
                    </div>

                    <div className="flex gap-2 w-full sm:w-auto">
                      <button 
                        type="submit"
                        className="flex-1 sm:flex-none px-6 py-2.5 bg-purple-600 hover:bg-purple-700 text-white font-medium rounded-lg shadow-sm transition-colors focus:ring-4 focus:ring-purple-500/30 outline-none whitespace-nowrap"
                      >
                        {editingMilestoneId ? 'Update' : 'Add Milestone'}
                      </button>
                      {editingMilestoneId && (
                        <button 
                          type="button"
                          onClick={handleMilestoneCancelEdit}
                          className="flex-1 sm:flex-none px-6 py-2.5 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-300 font-medium rounded-lg shadow-sm transition-colors outline-none whitespace-nowrap"
                        >
                          Cancel
                        </button>
                      )}
                    </div>
                  </form>
                </div>
              )}

              {milestoneTab === 'history' && (
                <div className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl overflow-hidden shadow-sm">
                  <div className="bg-slate-50 dark:bg-slate-800/60 border-b border-slate-200 dark:border-slate-700 px-5 py-4 flex items-center gap-3">
                    <h2 className="text-sm font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wide">Milestone History</h2>
                    <span className="text-xs font-medium text-slate-500 dark:text-slate-400 bg-slate-200 dark:bg-slate-700 px-2 py-1 rounded-full">{milestones.length} records</span>
                  </div>

                  {milestones.length === 0 ? (
                    <div className="p-8 text-center text-slate-500 dark:text-slate-400 text-sm">No milestones logged yet.</div>
                  ) : (
                    <div className="divide-y divide-slate-100 dark:divide-slate-700">
                      {[...milestones].sort((a, b) => new Date(b.date).getTime() - new Date(a.date).getTime()).map((milestone) => {
                        const hasDetails = !!(milestone.details && milestone.details.trim());
                        const isExpanded = expandedMilestoneId === milestone.id;

                        return (
                        <div key={milestone.id} className="px-5 py-3 hover:bg-slate-50 dark:hover:bg-slate-700/60 transition-colors">
                          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                            <div className="flex items-center gap-2 shrink-0">
                              <span className="text-purple-600 dark:text-purple-400 shrink-0">
                                <MilestoneIcon iconKey={milestone.icon} size={18} />
                              </span>
                              <span className="font-medium text-slate-800 dark:text-slate-100">
                                {new Date(milestone.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}
                              </span>
                            </div>

                            <div className="flex-1 sm:text-right flex items-center gap-2 justify-end">
                              <span className="text-purple-700 dark:text-purple-400 font-medium bg-purple-50 dark:bg-purple-950/40 px-2 py-0.5 rounded text-sm inline-block w-fit">
                                {milestone.description}
                              </span>
                              {hasDetails && (
                                <button
                                  type="button"
                                  onClick={() => setExpandedMilestoneId(isExpanded ? null : milestone.id)}
                                  aria-expanded={isExpanded}
                                  title={isExpanded ? 'Hide details' : 'Show details'}
                                  className="p-1 text-slate-400 dark:text-slate-500 hover:text-purple-600 dark:hover:text-purple-400 hover:bg-purple-50 dark:hover:bg-purple-950/40 rounded-md transition-colors"
                                >
                                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={"transition-transform duration-200 " + (isExpanded ? "rotate-180" : "")}><polyline points="6 9 12 15 18 9"></polyline></svg>
                                </button>
                              )}
                            </div>

                            <div className="flex items-center gap-2 shrink-0 self-end sm:self-auto">
                              <button 
                                onClick={() => handleMilestoneEdit(milestone)}
                                className="p-1.5 text-slate-400 dark:text-slate-500 hover:text-purple-600 dark:hover:text-purple-400 hover:bg-purple-50 dark:hover:bg-purple-950/40 rounded-md transition-colors"
                                title="Edit"
                              >
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                              </button>
                              <button 
                                onClick={() => handleMilestoneDelete(milestone.id)}
                                className="p-1.5 text-slate-400 dark:text-slate-500 hover:text-red-600 dark:hover:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/40 rounded-md transition-colors"
                                title="Delete"
                              >
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                              </button>
                            </div>
                          </div>

                          {hasDetails && (
                            <div
                              className={
                                "grid transition-all duration-200 ease-out motion-reduce:transition-none " +
                                (isExpanded ? "grid-rows-[1fr] opacity-100 mt-2" : "grid-rows-[0fr] opacity-0")
                              }
                              style={{ overflow: 'hidden' }}
                            >
                              <div className="min-h-0 sm:pl-6">
                                <p className="text-sm text-slate-600 dark:text-slate-300 whitespace-pre-wrap">{milestone.details}</p>
                              </div>
                            </div>
                          )}
                        </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}
              </React.Fragment>
            )}
              </div>
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
