<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sprog Log</title>

  <!-- Applies the correct light/dark class to <html> before first paint,
       so there is no flash of the wrong theme. Preference is read from the
       `theme` cookie (set by the toggle in the app, per-browser so each
       visitor can have their own setting); falling back to the OS/browser
       `prefers-color-scheme` when no cookie override exists yet. -->
  <script>
    (function () {
      function getCookie(name) {
        const match = document.cookie.match('(?:^|; )' + name + '=([^;]*)');
        return match ? decodeURIComponent(match[1]) : null;
      }
      const stored = getCookie('theme'); // 'light' | 'dark' | null (system)
      const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = stored === 'dark' || (stored !== 'light' && systemPrefersDark);
      document.documentElement.classList.toggle('dark', isDark);
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Use the `dark` class (toggled above / by the in-app toggle) to drive
    // dark mode instead of only `prefers-color-scheme`, so a locally
    // overridden preference always wins over the system setting.
    tailwind.config = {
      darkMode: 'class',
    };
  </script>

  <!-- Pinned all dependencies to exact versions to prevent future silent crashes -->
  <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/react-is@18.2.0/umd/react-is.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.4/babel.min.js"></script>
  <script src="https://unpkg.com/recharts@2.1.12/umd/Recharts.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 transition-colors duration-150">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;
    const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, ReferenceLine, ReferenceDot } = window.Recharts;

    // Updated to exact UK-WHO Girls Weight-for-Age centiles (in grams)
    const PERCENTILE_MILESTONES = [
      { months: 0, p2: 2400, p9: 2700, p25: 3000, p50: 3200, p75: 3600, p91: 4000, p98: 4200 },
      { months: 1, p2: 3200, p9: 3500, p25: 3900, p50: 4200, p75: 4600, p91: 5100, p98: 5500 },
      { months: 2, p2: 3900, p9: 4300, p25: 4700, p50: 5100, p75: 5600, p91: 6100, p98: 6600 },
      { months: 3, p2: 4500, p9: 4900, p25: 5400, p50: 5800, p75: 6400, p91: 6900, p98: 7500 },
      { months: 4, p2: 5000, p9: 5500, p25: 6000, p50: 6400, p75: 7100, p91: 7700, p98: 8200 },
      { months: 6, p2: 5700, p9: 6300, p25: 6900, p50: 7300, p75: 8100, p91: 8800, p98: 9500 },
      { months: 9, p2: 6500, p9: 7200, p25: 7800, p50: 8200, p75: 9100, p91: 10000, p98: 10800 },
      { months: 12, p2: 7000, p9: 7800, p25: 8500, p50: 8900, p75: 9900, p91: 11000, p98: 11900 },
    ];

    // WHO LMS parameters for Girls Weight-for-Age (0-12 months)
    const WHO_LMS_GIRLS = [
      { m: 0,  L: -0.3833, M: 3.2322, S: 0.14171 },
      { m: 1,  L: -0.3833, M: 4.1981, S: 0.13407 },
      { m: 2,  L: -0.3833, M: 5.1278, S: 0.12658 },
      { m: 3,  L: -0.3833, M: 5.8459, S: 0.12157 },
      { m: 4,  L: -0.3833, M: 6.4234, S: 0.11808 },
      { m: 5,  L: -0.3833, M: 6.8997, S: 0.11559 },
      { m: 6,  L: -0.3833, M: 7.2952, S: 0.11379 },
      { m: 7,  L: -0.3833, M: 7.6256, S: 0.11246 },
      { m: 8,  L: -0.3833, M: 7.9056, S: 0.11145 },
      { m: 9,  L: -0.3833, M: 8.1473, S: 0.11068 },
      { m: 10, L: -0.3833, M: 8.3601, S: 0.11010 },
      { m: 11, L: -0.3833, M: 8.5511, S: 0.10967 },
      { m: 12, L: -0.3833, M: 8.7247, S: 0.10934 }
    ];

    function normalCDF(x) {
      const t = 1 / (1 + 0.2316419 * Math.abs(x));
      const d = 0.3989423 * Math.exp(-x * x / 2);
      let p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
      if (x > 0) p = 1 - p;
      return p;
    }

    function getOrdinalSuffix(i) {
        const j = i % 10, k = i % 100;
        if (j == 1 && k != 11) return i + "st";
        if (j == 2 && k != 12) return i + "nd";
        if (j == 3 && k != 13) return i + "rd";
        return i + "th";
    }

    // TODO: add WHO_LMS_BOYS and return it here when sex === 'male'.
    // Both sexes resolve to the girls dataset for now so the existing
    // girl profile's chart cannot move.
    function getLmsTable(sex) {
      return WHO_LMS_GIRLS;
    }

    // TODO: add boys UK-WHO milestones and return them here when sex === 'male'.
    function getMilestones(sex) {
      return PERCENTILE_MILESTONES;
    }

    function getExactCentile(weightGrams, ageInDays, sex) {
      if (ageInDays < 0) ageInDays = 0;
      const ageInMonths = ageInDays / 30.4375;
      const lmsTable = getLmsTable(sex);

      let lower = lmsTable[0];
      let upper = lmsTable[lmsTable.length - 1];
      
      for (let i = 0; i < lmsTable.length - 1; i++) {
        if (ageInMonths >= lmsTable[i].m && ageInMonths <= lmsTable[i+1].m) {
          lower = lmsTable[i];
          upper = lmsTable[i+1];
          break;
        }
      }
      
      let L, M, S;
      if (lower.m === upper.m) {
        L = lower.L; M = lower.M; S = lower.S;
      } else {
        const fraction = (ageInMonths - lower.m) / (upper.m - lower.m);
        L = lower.L + (upper.L - lower.L) * fraction;
        M = lower.M + (upper.M - lower.M) * fraction;
        S = lower.S + (upper.S - lower.S) * fraction;
      }
      
      const X = weightGrams / 1000;
      let Z;
      if (L === 0) {
        Z = Math.log(X / M) / S;
      } else {
        Z = (Math.pow(X / M, L) - 1) / (L * S);
      }
      
      const percentile = normalCDF(Z) * 100;
      let roundedPercentile = Math.round(percentile * 10) / 10;
      if (roundedPercentile <= 0.1) roundedPercentile = 0.1;
      if (roundedPercentile >= 99.9) roundedPercentile = 99.9;
      
      if (Number.isInteger(roundedPercentile)) {
          return getOrdinalSuffix(roundedPercentile);
      }
      return roundedPercentile + "th";
    }

    // Dynamic linear regression function based on a flexible window size
    function calculateTrend(entries, windowSize) {
      if (entries.length < 2 || windowSize < 2) return null;
      // Get the last N entries based on user selection
      const recent = [...entries].sort((a,b) => new Date(a.date).getTime() - new Date(b.date).getTime()).slice(-windowSize);
      
      // If we don't even have 2 entries in our sliced window, return null
      if (recent.length < 2) return null;
      
      const n = recent.length;
      const t0 = new Date(recent[0].date).getTime();

      let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;

      recent.forEach(entry => {
        const x = (new Date(entry.date).getTime() - t0) / 86400000; // Normalised to days
        const y = entry.weight;
        sumX += x;
        sumY += y;
        sumXY += x * y;
        sumXX += x * x;
      });

      const denominator = (n * sumXX - sumX * sumX);
      if (denominator === 0) return null;

      const slope = (n * sumXY - sumX * sumY) / denominator;
      const intercept = (sumY - slope * sumX) / n;

      return { slope, intercept, t0 };
    }

    // Curated inline icon set for milestones. Keep the keys in sync with
    // MILESTONE_ICON_KEYS in server.js (used to validate the `icon` field).
    // Each icon is a set of standard 24x24 stroke-style SVG children,
    // matching the fill="none" stroke="currentColor" convention used by
    // every other inline icon in this file.
    const MILESTONE_ICONS = [
      { key: 'trophy', label: 'Trophy', children: (<React.Fragment><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></React.Fragment>) },
      { key: 'star', label: 'Star', children: (<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>) },
      { key: 'heart', label: 'Heart', children: (<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path>) },
      { key: 'smile', label: 'Smile', children: (<React.Fragment><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></React.Fragment>) },
      { key: 'foot', label: 'Footprints', children: (<React.Fragment><ellipse cx="9" cy="7" rx="3" ry="4"></ellipse><ellipse cx="15" cy="17" rx="3" ry="4"></ellipse></React.Fragment>) },
      { key: 'tooth', label: 'Tooth', children: (<path d="M12 2c-3 0-5 3-5 6 0 2 1 3 1.5 5.5S9 21 10 21s1-2 1.5-3c.2-.8.5-1 .5-1s.3.2.5 1c.5 1 1 3 1.5 3s.5-2.5 1-5.5C17 11 17 10 17 8c0-3-2-6-5-6Z"></path>) },
      { key: 'moon', label: 'Sleep', children: (<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>) },
      { key: 'bath', label: 'Bath', children: (<React.Fragment><path d="M9 6V4a2 2 0 0 1 4 0v2"></path><path d="M2 12h20"></path><path d="M4 12v4a4 4 0 0 0 4 4h8a4 4 0 0 0 4-4v-4"></path><line x1="7" y1="20" x2="7" y2="22"></line><line x1="17" y1="20" x2="17" y2="22"></line></React.Fragment>) },
      { key: 'bottle', label: 'Feeding', children: (<React.Fragment><path d="M9 2h6"></path><path d="M10 2v3.5L8 8v11a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V8l-2-2.5V2"></path><line x1="8" y1="12" x2="16" y2="12"></line></React.Fragment>) },
      { key: 'food', label: 'Solid Food', children: (<React.Fragment><path d="M3 11h18"></path><path d="M20 11a8 8 0 1 1-16 0"></path><path d="M12 3v6"></path></React.Fragment>) },
      { key: 'crawl', label: 'Crawling', children: (<React.Fragment><circle cx="12" cy="6" r="3"></circle><path d="M6 20c0-4 2-7 6-7s6 3 6 7"></path></React.Fragment>) },
      { key: 'walk', label: 'Walking', children: (<React.Fragment><circle cx="12" cy="4" r="2"></circle><path d="M12 8v5l-4 7"></path><path d="M12 13l4 6"></path><path d="M8 11l4-3 4 3"></path></React.Fragment>) },
      { key: 'hand', label: 'Hand', children: (<React.Fragment><path d="M18 11V6a2 2 0 1 0-4 0v5"></path><path d="M14 10V4a2 2 0 1 0-4 0v7"></path><path d="M10 11V6a2 2 0 1 0-4 0v8"></path><path d="M6 14v-1a2 2 0 1 0-4 0v3a7 7 0 0 0 7 7h2a7 7 0 0 0 7-7v-4"></path></React.Fragment>) },
      { key: 'wave', label: 'Waving', children: (<React.Fragment><path d="M3 12c2-3 4-3 6 0s4 3 6 0 4-3 6 0"></path><path d="M3 17c2-3 4-3 6 0s4 3 6 0 4-3 6 0"></path></React.Fragment>) },
      { key: 'sit', label: 'Sitting', children: (<React.Fragment><circle cx="12" cy="5" r="2"></circle><path d="M9 21v-6l-2-2 1-4 4 1 4-1 1 4-2 2v6"></path></React.Fragment>) },
      { key: 'roll', label: 'Rolling', children: (<React.Fragment><circle cx="12" cy="12" r="8"></circle><path d="M8 12a4 4 0 1 0 8 0"></path></React.Fragment>) },
      { key: 'speech', label: 'First Words', children: (<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>) },
      { key: 'music', label: 'Music', children: (<React.Fragment><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></React.Fragment>) },
      { key: 'book', label: 'Reading', children: (<React.Fragment><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></React.Fragment>) },
      { key: 'camera', label: 'Photo', children: (<React.Fragment><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></React.Fragment>) },
      { key: 'sun', label: 'Outing', children: (<React.Fragment><circle cx="12" cy="12" r="4"></circle><line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line></React.Fragment>) },
      { key: 'gift', label: 'Celebration', children: (<React.Fragment><rect x="3" y="8" width="18" height="4" rx="1"></rect><path d="M12 8v13"></path><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"></path><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"></path></React.Fragment>) },
      { key: 'sparkle', label: 'Sparkle', children: (<path d="M12 3l1.5 5.5L19 10l-5.5 1.5L12 17l-1.5-5.5L5 10l5.5-1.5L12 3z"></path>) },
      { key: 'medal', label: 'Medal', children: (<React.Fragment><circle cx="12" cy="15" r="6"></circle><path d="M9 10L5 2"></path><path d="M15 10l4-8"></path><path d="M9.5 15.5l1 3 1.5-1 1.5 1 1-3"></path></React.Fragment>) },
    ];
    const MILESTONE_ICON_MAP = MILESTONE_ICONS.reduce((acc, icon) => {
      acc[icon.key] = icon;
      return acc;
    }, {});

    // Renders a milestone's chosen icon. Falls back to the trophy icon for
    // unknown/missing keys so milestones created before this feature (or
    // with a stale key) still render something sensible.
    function MilestoneIcon({ iconKey, size = 16, className = '' }) {
      const icon = MILESTONE_ICON_MAP[iconKey] || MILESTONE_ICON_MAP.trophy;
      return (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          {icon.children}
        </svg>
      );
    }

    // Clickable icon trigger that opens a popover grid of selectable icons.
    // Closes on selection, Escape, or an outside click.
    function IconPicker({ value, onChange }) {
      const [open, setOpen] = useState(false);
      const containerRef = useRef(null);

      useEffect(() => {
        if (!open) return;
        const handlePointerDown = (e) => {
          if (containerRef.current && !containerRef.current.contains(e.target)) {
            setOpen(false);
          }
        };
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') setOpen(false);
        };
        document.addEventListener('mousedown', handlePointerDown);
        document.addEventListener('keydown', handleKeyDown);
        return () => {
          document.removeEventListener('mousedown', handlePointerDown);
          document.removeEventListener('keydown', handleKeyDown);
        };
      }, [open]);

      return (
        <div className="relative" ref={containerRef}>
          <button
            type="button"
            onClick={() => setOpen((o) => !o)}
            aria-haspopup="dialog"
            aria-expanded={open}
            title="Choose icon"
            className="flex items-center justify-center w-11 h-11 border border-purple-300 dark:border-purple-700 rounded-lg bg-white dark:bg-slate-800 text-purple-600 dark:text-purple-400 hover:bg-purple-50 dark:hover:bg-purple-950/40 transition-colors focus:ring-2 focus:ring-purple-500 outline-none"
          >
            <MilestoneIcon iconKey={value} size={20} />
          </button>

          <div
            className={
              "absolute left-0 z-20 mt-2 w-72 max-w-[calc(100vw-2.5rem)] bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-xl rounded-xl p-3 origin-top-left transition-all duration-150 ease-out motion-reduce:transition-none " +
              (open ? "opacity-100 scale-100 pointer-events-auto" : "opacity-0 scale-95 pointer-events-none")
            }
            role="dialog"
            aria-label="Choose an icon"
          >
            <div className="grid grid-cols-5 sm:grid-cols-6 gap-1.5">
              {MILESTONE_ICONS.map((icon) => (
                <button
                  key={icon.key}
                  type="button"
                  onClick={() => {
                    onChange(icon.key);
                    setOpen(false);
                  }}
                  aria-label={icon.label}
                  title={icon.label}
                  className={
                    "flex items-center justify-center w-9 h-9 rounded-lg shrink-0 transition-colors " +
                    (value === icon.key
                      ? "bg-purple-600 text-white"
                      : "text-purple-600 dark:text-purple-400 hover:bg-purple-100 dark:hover:bg-purple-900/50")
                  }
                >
                  <MilestoneIcon iconKey={icon.key} size={18} />
                </button>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // Reads/writes the `theme` cookie so the light/dark preference is
    // stored per-browser (each visitor gets their own cookie) rather than
    // tied to the shared account/profile data. A missing cookie means
    // "follow the system setting", which is kept live via a
    // prefers-color-scheme listener so the app follows OS-level changes
    // until the user explicitly overrides it with the toggle.
    const THEME_COOKIE = 'theme';
    const THEME_COOKIE_MAX_AGE = 60 * 60 * 24 * 365; // 1 year

    function readThemeCookie() {
      const match = document.cookie.match('(?:^|; )' + THEME_COOKIE + '=([^;]*)');
      return match ? decodeURIComponent(match[1]) : null;
    }

    function writeThemeCookie(value) {
      document.cookie = THEME_COOKIE + '=' + encodeURIComponent(value) +
        '; max-age=' + THEME_COOKIE_MAX_AGE + '; path=/; SameSite=Lax';
    }

    function useTheme() {
      const [override, setOverride] = useState(() => readThemeCookie()); // 'light' | 'dark' | null
      const [systemPrefersDark, setSystemPrefersDark] = useState(
        () => !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
      );

      useEffect(() => {
        if (!window.matchMedia) return;
        const mql = window.matchMedia('(prefers-color-scheme: dark)');
        const handleChange = (e) => setSystemPrefersDark(e.matches);
        if (mql.addEventListener) mql.addEventListener('change', handleChange);
        else mql.addListener(handleChange);
        return () => {
          if (mql.removeEventListener) mql.removeEventListener('change', handleChange);
          else mql.removeListener(handleChange);
        };
      }, []);

      const isDark = override ? override === 'dark' : systemPrefersDark;

      useEffect(() => {
        document.documentElement.classList.toggle('dark', isDark);
      }, [isDark]);

      const toggleTheme = () => {
        const next = isDark ? 'light' : 'dark';
        writeThemeCookie(next);
        setOverride(next);
      };

      return { isDark, toggleTheme };
    }

    // Day/night toggle, fixed to the top-right corner so it's reachable
    // from every screen (onboarding, loading, and the main app).
    function ThemeToggle({ isDark, onToggle }) {
      return (
        <button
          type="button"
          onClick={onToggle}
          title={isDark ? 'Switch to light mode' : 'Switch to dark mode'}
          aria-label={isDark ? 'Switch to light mode' : 'Switch to dark mode'}
          className="fixed top-3 right-3 md:top-5 md:right-5 z-50 flex items-center justify-center w-10 h-10 rounded-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-300 shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors"
        >
          {isDark ? (
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
          ) : (
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"></circle><line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line></svg>
          )}
        </button>
      );
    }

    // Used for both first-run onboarding (not dismissable) and later edits
    // via the settings gear (dismissable, prefilled).
    function ProfileModal({ initialValues, dismissable, onCancel, onSubmit }) {
      const [name, setName] = useState(initialValues.name || '');

    // fetch wrapper that rejects non-ok responses with the HTTP status and
    // parsed body attached, so callers can react to 401s (locked / session
    // expired) and surface server error messages.
    async function fetchJson(url, options) {
      const res = await fetch(url, options);
      if (!res.ok) {
        const err = new Error('Request failed with status ' + res.status);
        err.status = res.status;
        try {
          err.body = await res.json();
        } catch (e) {
          err.body = null;
        }
        throw err;
      }
      // Some endpoints (e.g. a successful unlock) may return an empty
      // body; tolerate that instead of failing to parse JSON.
      const text = await res.text();
      return text ? JSON.parse(text) : null;
    }

    // Full-screen PIN gate shown instead of the tracker: first-run setup
    // (confirm=true) and day-to-day unlocking. Styling mirrors
    // ProfileModal; actual enforcement is server-side.
    function PinScreen({ title, subtitle, submitLabel, confirm, onSubmit }) {
      const [pin, setPin] = useState('');
      const [confirmPin, setConfirmPin] = useState('');

            <p className="text-slate-500 dark:text-slate-400 text-sm mb-6">{subtitle}</p>
            <form onSubmit={handleSubmit} className="flex flex-col gap-4">

                    className="w-full px-4 py-2.5 border border-slate-300 dark:border-slate-600 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 transition-all bg-white dark:bg-slate-800"
